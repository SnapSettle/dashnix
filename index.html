<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="fonts/PlusJakartaSans-VariableFont_wght.ttf" as="font" crossorigin>

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22none%22 stroke=%22%23@accentColor@%22 stroke-width=%225%22/><path d=%22M50 20 L50 35 M80 50 L65 50 M50 80 L50 65 M20 50 L35 50%22 stroke=%22%23@accentColor@%22 stroke-width=%226%22 stroke-linecap=%22round%22/><path d=%22M50 50 L75 30%22 stroke=%22%23@textColor@%22 stroke-width=%228%22 stroke-linecap=%22round%22/></svg>" />

  <style>
    :root {
      --accent: #@accentColor@;
      --bg: #@bgColor@;
      --card-bg: #@cardColor@;
      --text: #@textColor@;

      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-surface: rgba(255, 255, 255, 0.05);
      --hover-border: #@accentColor@;

      --shadow-sm: 0 4px 20px -2px rgba(0, 0, 0, 0.25);
      --shadow-lg: 0 20px 40px -15px rgba(0, 0, 0, 0.4), 0 0 30px #@accentColor@25;

      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;

      --heading-gradient: linear-gradient(180deg, var(--text) 0%, rgba(255, 255, 255, 0.7) 100%);
      --bg-overlay: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.2) 0%, rgba(0, 0, 0, 0.6) 100%);
      --badge-bg: rgba(0, 0, 0, 0.3);
      --counter-bg: rgba(255, 255, 255, 0.08);
      --border-subtle: rgba(255, 255, 255, 0.1);
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }

      /* Completely stop heavy ambient background light animations */
      body::before,
      body::after {
        animation: none !important;
        filter: none !important;
        opacity: 0.1 !important;
      }

      /* Disable 3D tilt transformations and spotlight borders on cards */
      .card {
        transform: none !important;
        transition: none !important;
      }

      .card::before {
        display: none !important;
      }

      .logo {
        transition: none !important;
      }

      /* Stop pulsing live status dots */
      .card.online .status-dot {
        animation: none !important;
      }
    }

    /* Light mode adjustments */
    @media (prefers-color-scheme: light) {
      :root {
        --text: #1e293b;
        --glass-border: rgba(0, 0, 0, 0.08);
        --glass-surface: rgba(255, 255, 255, 0.7);
        --shadow-sm: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        --shadow-lg: 0 20px 30px -10px rgba(0, 0, 0, 0.1), 0 0 25px #@accentColor@35;
        --heading-gradient: linear-gradient(180deg, #0f172a 0%, #334155 100%);
        --bg-overlay: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.6) 0%, rgba(241, 245, 249, 0.9) 100%);
        --badge-bg: rgba(255, 255, 255, 0.85);
        --counter-bg: rgba(0, 0, 0, 0.05);
        --border-subtle: rgba(0, 0, 0, 0.08);
      }
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      shape-rendering: geometricPrecision;
      text-rendering: optimizeLegibility;
    }

    html {
      min-height: 100%;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 10%, #@accentColor@25 0%, transparent 45%),
        radial-gradient(circle at 90% 85%, #@accentColor@18 0%, transparent 50%),
        var(--bg-overlay);
      background-attachment: fixed;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: var(--text);
      padding: 3.5rem 2rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated Ambient Lights */
    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 40rem;
      height: 40rem;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
      animation: float 18s ease-in-out infinite alternate;
    }

    body::before {
      background: #@accentColor@;
      top: -10rem;
      left: -10rem;
    }

    body::after {
      background: #@accentColor@;
      bottom: -15rem;
      right: -10rem;
      animation-delay: -9s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, 30px) scale(1.08); }
      100% { transform: translate(-20px, 50px) scale(0.95); }
    }

    .container {
      max-width: 1380px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* Header Styling */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-bottom: 3rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .logo {
      width: 62px;
      height: 62px;
      border-radius: 20px;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: var(--shadow-sm);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .logo:hover {
      transform: rotate(8deg) scale(1.05);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 3.5vw, 2.75rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: var(--heading-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      opacity: 0.75;
      margin-top: 0.25rem;
      font-size: 0.925rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-counter {
      background: var(--counter-bg);
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      font-size: 0.8rem;
      border: 1px solid var(--glass-border);
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
      perspective: 1000px;
    }

    /* Card Styling */
    .card {
      position: relative;
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      background: var(--glass-surface), var(--card-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      text-decoration: none;
      color: inherit;
      overflow: hidden;
      min-height: 210px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;

      transform-style: preserve-3d;
      transition:
        transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
        border-color 0.3s ease,
        box-shadow 0.35s ease,
        opacity 0.3s ease;

      box-shadow: var(--shadow-sm);
    }

    /* Mouse Spotlight Border Effect */
    .card::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1.5px;
      background: radial-gradient(350px circle at var(--hover-x, 50%) var(--hover-y, 50%),
          var(--hover-border) 0%,
          rgba(255, 255, 255, 0.25) 50%,
          transparent 80%);
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .card:hover:not(.disabled)::before {
      opacity: 1;
    }

    .card:hover:not(.disabled) {
      transform: translateY(-8px) rotateX(var(--rotate-x, 0deg)) rotateY(var(--rotate-y, 0deg));
      box-shadow: var(--shadow-lg);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .card:active:not(.disabled) {
      transform: translateY(-2px) scale(0.98);
    }

    .card.disabled {
      opacity: 0.45;
      filter: grayscale(0.85);
      cursor: not-allowed;
      border-color: var(--border-subtle);
    }

    /* Live Status Badge */
    .status-badge {
      position: absolute;
      top: 18px;
      right: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--badge-bg);
      border: 1px solid var(--glass-border);
      font-size: 0.725rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      z-index: 2;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #6b7280;
    }

    .card.online .status-badge {
      color: #16a34a;
      border-color: rgba(34, 197, 94, 0.3);
      background: rgba(34, 197, 94, 0.12);
    }

    .card.online .status-dot {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse-dot 2s ease-in-out infinite;
    }

    .card.offline .status-badge {
      color: #dc2626;
      border-color: rgba(239, 68, 68, 0.3);
      background: rgba(239, 68, 68, 0.12);
    }

    .card.offline .status-dot {
      background: #ef4444;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Icon Container */
    .icon-wrapper {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-md);
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .card:hover:not(.disabled) .icon-wrapper {
      transform: scale(1.08);
    }

    .icon-wrapper::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transform: rotate(30deg);
      transition: opacity 0.3s ease;
    }

    .icon {
      width: 30px;
      height: 30px;
      object-fit: contain;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15));
    }

    /* Card Details */
    .card-content {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    h3 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .card-subtitle {
      font-size: 0.85rem;
      opacity: 0.65;
      font-family: monospace;
      letter-spacing: -0.01em;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      opacity: 0.75;
    }

    @media (max-width: 640px) {
      body {
        padding: 2rem 1.25rem;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 1rem;
      }

      .card {
        min-height: 180px;
        padding: 1.25rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div class="header-brand">
        <div class="logo">
          <svg width="32" height="32" viewBox="0 0 100 100" shape-rendering="geometricPrecision">
            <circle cx="50" cy="50" r="45" fill="none" stroke="var(--accent)" stroke-width="6" />
            <path d="M50 20 L50 35 M80 50 L65 50 M50 80 L50 65 M20 50 L35 50" stroke="var(--accent)" stroke-width="6"
              stroke-linecap="round" />
            <path d="M50 50 L75 30" stroke="var(--text)" stroke-width="8" stroke-linecap="round" />
          </svg>
        </div>

        <div>
          <h1>Dashboard</h1>
          <div class="subtitle">
            Self-hosted infrastructure 
            <span class="status-counter" id="status-counter">0 Active</span>
          </div>
        </div>
      </div>
    </header>

    <div id="grid" class="grid"></div>
  </div>

  <script>
  let rawServices = null;
  try {
    rawServices = @servicesJson@;
  } catch (e) {
    console.error("Failed to parse services JSON:", e);
  }
  const services = Array.isArray(rawServices) ? rawServices : [];
  const grid = document.getElementById('grid');
  const statusCounter = document.getElementById('status-counter');
  const host = window.location.hostname;

  const onlineStatuses = new Map();

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function renderCards() {
    grid.innerHTML = '';
    
    if (!services || services.length === 0) {
      grid.innerHTML = `<div class="empty-state">No services available</div>`;
      return;
    }

    services.forEach(s => {
      const url = `http://${host}:${s.port}`;
      const card = document.createElement('a');
      card.className = 'card';
      card.id = `card-${s.name}`;
      card.href = url;

      const knownStatus = onlineStatuses.get(s.name);
      let statusClass = '';
      let statusLabel = 'Checking';

      if (knownStatus === true) {
        statusClass = 'online';
        statusLabel = 'Online';
      } else if (knownStatus === false) {
        statusClass = 'disabled offline';
        statusLabel = 'Offline';
      }

      card.className = `card ${statusClass}`.trim();

      card.innerHTML = `
        <div class="status-badge">
          <span class="status-dot"></span>
          <span class="status-text">${statusLabel}</span>
        </div>

        <div class="icon-wrapper" id="icon-wrapper-${s.name}">
          <img class="icon" src="${url}${s.favicon}" alt="${s.name} favicon" id="img-${s.name}">
        </div>

        <div class="card-content">
          <h3>${s.name}</h3>
          <div class="card-subtitle">${host}:${s.port}</div>
        </div>
      `;

      grid.appendChild(card);

      // Mouse motion effect
      card.addEventListener('mousemove', e => {
        if (prefersReducedMotion) return;

        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -7;
        const rotateY = ((x - centerX) / centerX) * 7;

        card.style.setProperty('--hover-x', `${x}px`);
        card.style.setProperty('--hover-y', `${y}px`);
        card.style.setProperty('--rotate-x', `${rotateX}deg`);
        card.style.setProperty('--rotate-y', `${rotateY}deg`);
      });

      card.addEventListener('mouseleave', () => {
        if (prefersReducedMotion) return;
        card.style.setProperty('--rotate-x', '0deg');
        card.style.setProperty('--rotate-y', '0deg');
      });
    });
  }

  // Non-blocking ping check per service
  function checkServiceStatus(s) {
    return new Promise((resolve) => {
      const url = `http://${host}:${s.port}`;
      const img = new Image();
      let handled = false;

      const timeoutId = setTimeout(() => {
        if (!handled) {
          handled = true;
          updateCardUI(s.name, false);
          resolve(false);
        }
      }, 2500);

      img.onload = () => {
        if (handled) return;
        handled = true;
        clearTimeout(timeoutId);
        updateCardUI(s.name, true);
        resolve(true);
      };

      img.onerror = () => {
        if (handled) return;
        handled = true;
        clearTimeout(timeoutId);

        // Fallback fetch check
        fetch(`${url}/`, { mode: 'no-cors', cache: 'no-cache' })
          .then(() => {
            updateCardUI(s.name, true);
            resolve(true);
          })
          .catch(() => {
            updateCardUI(s.name, false);
            resolve(false);
          });
      };

      img.src = `${url}${s.favicon}?_=${Date.now()}`;
    });
  }

  function updateCardUI(serviceName, isOnline) {
    onlineStatuses.set(serviceName, isOnline);
    const card = document.getElementById(`card-${serviceName}`);
    if (!card) return;

    const statusText = card.querySelector('.status-text');

    if (isOnline) {
      card.classList.remove('disabled', 'offline');
      card.classList.add('online');
      if (statusText) statusText.textContent = 'Online';
    } else {
      card.classList.remove('online');
      card.classList.add('disabled', 'offline');
      if (statusText) statusText.textContent = 'Offline';
    }

    updateCounter();
  }

  function updateCounter() {
    let onlineCount = 0;
    onlineStatuses.forEach((isOnline) => {
      if (isOnline) onlineCount++;
    });
    statusCounter.textContent = `${onlineCount} / ${services.length} Online`;
  }

  // Polls concurrently without blocking UI main-thread or layout rendering
  function pollAllServices() {
    services.forEach(checkServiceStatus);
  }

  // Init
  renderCards();
  pollAllServices();
  setInterval(pollAllServices, 10000);
</script>
</body>

</html>
